server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "gamepad=(self), cross-origin-isolated=(self), fullscreen=(self)" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control "no-cache" always;
  types {
    text/html html;
    text/javascript js;
    application/wasm wasm;
    text/css css;
    application/octet-stream bin;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/svg+xml svg;
  }
  # Only these two exact local files are exposed, no directory listing.
  location = /game-data/disc.cue {
    alias "/srv/fish-disc/Fisherman's Bait 2 - Big Ol' Bass.cue";
    default_type text/plain;
    add_header Cache-Control "no-store" always;
  }
  location = /game-data/disc.bin {
    alias "/srv/fish-disc/Fisherman's Bait 2 - Big Ol' Bass.bin";
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
  }
  # Explicit user-initiated 12-second gamepad diagnostics. Only button indices,
  # translated PS1 masks, PS1 mode, and frame counts in query string.
  # nginx logs requests for inspection by the operator; no writeable endpoint.
  location = /pad-diagnostic {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 204;
  }
  location / { try_files $uri $uri/ =404; }
}
